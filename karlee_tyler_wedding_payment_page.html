<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karlee & Tyler | Wedding Gifts</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: #f5efe5;
    color: #4d4a3f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #fffdf8;
    border: 1px solid #ddd2bd;
    border-radius: 24px;
    padding: 38px 26px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(80,70,50,.10);
  }
  .leaf { font-size: 28px; letter-spacing: 8px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 38px; color: #555a45; }
  .subtitle { margin: 10px 0 26px; font-size: 17px; line-height: 1.5; }
  .message { line-height: 1.6; margin-bottom: 25px; }
  a.button {
    display: block;
    text-decoration: none;
    margin: 13px 0;
    padding: 17px 20px;
    border-radius: 14px;
    background: #7a8060;
    color: white;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  a.button.alt { background: #a06f4e; }
  .footer { margin-top: 28px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <div class="leaf">🌿 🤍 🌿</div>
    <h1>Karlee & Tyler</h1>
    <div class="subtitle">Thank you for celebrating our special day with us!</div>

    <div class="message">
      If you'd like to give us a wedding gift, you can choose either option below.
      Your love and support mean the world to us!
    </div>

    <a class="button" href="https://cash.app/$karl33ann18" target="_blank" rel="noopener">
      💵 Gift via Cash App
    </a>

    <a class="button alt" href="https://venmo.com/u/karl33ann18" target="_blank" rel="noopener">
      💚 Gift via Venmo
    </a>

    <div class="footer">
      With love,<br><strong>Karlee & Tyler</strong> 💍
    </div>
  </main>
</body>
</html>
